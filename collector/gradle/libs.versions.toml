# ★ 工具链要**一起升**，别拆成单个 PR：androidx.core-ktx 1.19.0 硬要求 AGP >= 9.1，
#   而 AGP 9 又要求 Gradle 9 —— 单独合任何一个都会让构建失败（dependabot 拆三条 PR 踩过）。
# ★ 也没有 kotlin 版本了：AGP 9 **内置 Kotlin**，不再 apply kotlin.android 插件（喜欢再自行指定）。
[versions]
agp = "9.4.1"
core = "1.19.0"
appcompat = "1.8.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
