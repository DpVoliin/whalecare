[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whalecare"
version = "0.1.27"
description = "鲸鲸 · 自托管的个人数据中枢：常驻、能读你自己的数据、能主动关心"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DpVoliin" }]
keywords = ["self-hosted", "local-first", "privacy", "personal-data", "quantified-self", "proactive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
# ★ 这一行是机器可读的「零依赖」证明：pip show / 各种依赖扫描工具都会显示 0 dependencies
dependencies = []

[project.urls]
Homepage = "https://github.com/DpVoliin/whalecare"
Repository = "https://github.com/DpVoliin/whalecare"
Source = "https://github.com/DpVoliin/whalecare"
Issues = "https://github.com/DpVoliin/whalecare/issues"
Changelog = "https://github.com/DpVoliin/whalecare/blob/main/CHANGELOG.md"
Documentation = "https://github.com/DpVoliin/whalecare/blob/main/README.md"
Privacy = "https://github.com/DpVoliin/whalecare/blob/main/docs/PRIVACY.md"

[project.scripts]
whalecare = "whalecare.__main__:main"

[tool.setuptools]
# 单文件分发是主线；这里只装 **一个薄壳包**（whalecare/），它的 __main__ 把 hub.py 当程序跑。
# hub.py 不进 git 的 whalecare/ 目录 —— 由发布流程在打包前 `cp hub/hub.py whalecare/hub.py`，
# 这样"单文件"始终只有一个真相，不会出现两份互相漂移的副本。
packages = ["whalecare"]
package-data = { whalecare = ["hub.py"] }

[tool.ruff]
line-length = 120
target-version = "py311"
# ★ 为什么排除 hub/src：
#   那里的 13 个 .py 是**片段**，不是可独立导入的模块（彼此引用全局，例如 97_http 用 10_core 的 db()），
#   单独 lint 必然刷出几百个 F821「未定义名」假阳性（实测 662 处，2026-09-22）。
#   想直接 lint 片段就用 `hub/src/whalecare/ruff.toml`（见 `ruff check hub/src/whalecare/`），
#   那份配置只关跨片段的假阳性，保留其余真错误 —— 与产物那一步是**两个分工的门禁**。
#   片段由 build_single.py 的「逐片段语法校验 + 结构断言 + 与产物逐字节等价」把关；
#   真正要 lint 的是**产物** hub/hub.py —— 它是完整模块，那 645 个假阳性消失，
#   而且能抓到只有跨片段才暴露的真 bug（例：缺 import pathlib，见 2026-09-22 那次修复）。
extend-exclude = ["hub/src", "hub/dist"]

[tool.ruff.lint]
# 单人项目里 ruff 最大的价值：统一你自己三个月前后的写法 + 抓真错误（未用变量/未定义名/裸 except…）
# ★ 刻意不选 "UP"：那组 pyupgrade 规则要求把全库刻意的 %-格式化（194 处）改成 f-string、
#   把 `# -*- coding: utf-8 -*-` 头（31 处）删掉、把 isinstance 改 PEP604 —— 纯风格翻新，
#   零收益，还会动到"必须逐字节等价"的合并产物。
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # 长行交给 line-length 管，不重复报
    "E702",   # 分号连写多语句：紧凑工具代码刻意这么写
    "E731",   # lambda 赋值：短工具函数这么写更清楚
    "E741",   # 单字母 l/I/O：循环与数学场景更贴近原意
    "E402",   # import 不在文件顶部：片段拼接结构使然（合并后顺序由文件名前缀决定）
    "E401",   # 一行 import 多个：同上
]

[tool.ruff.format]
quote-style = "preserve"
